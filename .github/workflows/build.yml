name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake ninja-build python3 git curl zip unzip tar \
            pkg-config autoconf autoconf-archive automake libtool \
            xorg-dev libxinerama-dev libxcursor-dev libglu1-mesa-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev wayland-protocols extra-cmake-modules

      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        run: cmake --preset linux

      - name: Build
        run: cmake --build --preset linux

  windows:
    name: Windows MSVC
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:USERPROFILE\vcpkg"
          & "$env:USERPROFILE\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Build
        run: cmake --build --preset windows-msvc

  macos:
    name: MacOS
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          brew update
          brew install cmake ninja python git curl zip unzip pkgconf autoconf autoconf-archive automake libtool

      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        run: cmake --preset macos

      - name: Build
        run: cmake --build --preset macos